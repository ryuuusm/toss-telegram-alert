# 토스증권 가격 알림봇 설정 예시. 이 파일을 config.toml로 복사해서 고치세요.
# 아래 숫자는 모두 예시입니다. 어떤 가격이 "살 만한지/팔 만한지"는 본인이 정해야 합니다.

[general]
interval_seconds = 60        # 확인 간격(초). 10~3600
cooldown_minutes = 60        # 같은 조건이 계속되면 이 간격마다만 다시 알림
timezone = "Asia/Seoul"
weekdays_only = true         # 주말에는 확인하지 않음 (공휴일은 걸러내지 않음)
state_file = "alert_state.json"

# 시세를 확인할 시간대(위 timezone 기준). 자정을 넘는 구간도 쓸 수 있습니다(예: "22:30-06:00").
[hours]
KR = ["08:00-20:00"]         # 국내: NXT 프리·애프터마켓 포함 범위
# US = ["22:30-05:00"]       # 미국 정규장(서머타임 해제 기간 기준). 서머타임 중에는 "21:30-04:00"

# ── 보유 종목: 평단 대비 수익률 기준 (모든 보유 종목에 공통 적용) ──
[holdings]
enabled = true
take_profit_pct = 15         # 평단 대비 +15% 이상이면 [익절 검토]
stop_loss_pct = -8           # 평단 대비 -8% 이하이면 [손절 검토]
ignore = []                  # 알림에서 뺄 종목 코드, 예: ["069500"]

# 종목별 예외: 위 공통 기준을 덮어쓰거나, 절대 가격 기준을 추가
[[holdings.override]]
symbol = "005930"
take_profit_pct = 20
sell_above = 95000           # 이 가격 이상이면 [목표가 도달]
sell_below = 60000           # 이 가격 이하이면 [하한가 이탈]

# ── 관심 종목: 매수 검토 가격 ──
[[watch]]
symbol = "000660"            # 국내: 6자리 종목코드
name = "SK하이닉스"
buy_below = 180000           # 이 가격 이하로 내려오면 [매수 검토]

[[watch]]
symbol = "AAPL"              # 미국: 티커 ([hours]에 US를 켜야 확인)
name = "Apple"
buy_below = 180
# buy_above = 250            # 이 가격 이상으로 올라가면 [돌파 매수 검토]
